services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "13378:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # ABS state stays with the project's persistent data.
      - ./data/audiobookshelf/config:/config
      - ./data/audiobookshelf/metadata:/metadata
      # Alexandria's CLI book projects and generated audio.
      # Keep the library read-only so ABS cannot alter pipeline state.
      - ./books:/audiobooks:ro
    restart: unless-stopped
