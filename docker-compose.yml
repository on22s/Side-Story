services:
  alexandria:
    build: .
    ports:
      # Keep the unauthenticated default local to this host.
      - "127.0.0.1:4200:4200"
    environment:
      # Preserve the fork's settings path across image upgrades and restarts.
      - ALEXANDRIA_CONFIG_PATH=/alexandria/config/config.json
    volumes:
      # Model weights download on first use.
      - hf_cache:/root/.cache/huggingface
      # Persist every mutable artifact, including state and voice libraries.
      - ./data/runtime:/alexandria/runtime
      # Preserve existing host data paths; no copying/moving is required.
      - ./data/uploads:/alexandria/runtime/uploads
      - ./data/designed_voices:/alexandria/runtime/designed_voices
      - ./data/clone_voices:/alexandria/runtime/clone_voices
      - ./data/lora_models:/alexandria/runtime/lora_models
      - ./data/lora_datasets:/alexandria/runtime/lora_datasets
      - ./data/dataset_builder:/alexandria/runtime/dataset_builder
      - ./data/scripts:/alexandria/runtime/scripts
      - ./data/output:/alexandria/runtime/voicelines
      - ./data/config:/alexandria/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_cache:
